# Mongo DB database configuration
DB_MONGO_CONNECTION_STRING = "mongodb://127.0.0.1:27017/"
DB_MONGO_DATABASE_NAME = "myEhrDatabase"

# AUTH - this section controls what authentication is used
AUTH_TYPE = "NoAuth" # can be set to 'NoAuth', 'OAuth2', 'OIDC'

# CONTENT - this section configures settings related to content within the system
CONTENT_PRELOAD_FOLDER = "test/pyehr/endtoend/test_config/preload" # this points to the folders of content that will be preloaded
                                                                        # into the system at startup if they don't already exist