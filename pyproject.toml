[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyehr"]

[project]
name="pyehr-openehr"
version="0.1.2"
authors = [
    {name="Henry Wright"}
]
description = "Python implementation of the openEHR (R) standard"
readme = "README.md"
requires-python = ">=3.12.1"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Flask",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Intended Audience :: Healthcare Industry"
]
license = "GPL-3.0-or-later"
license-files = ["LICENCE"]
dependencies = [
    "antlr4-python3-runtime~=4.13.2",
    "antlr4-tools~=0.2.2",
    "compress-pickle~=2.1.0",
    "email-validator~=2.3.0",
    "lz4~=4.4.5",
    "numpy~=2.4.6",
    "pydantic~=2.13.4",
    "pymongo~=4.17.0",
    "python-dotenv~=1.2.2",
    "python-multipart~=0.0.32",
    "rignore~=0.7.6",
    "semver~=3.0.4",
    "xmlschema~=4.3.1",
    "uritools~=6.1.2",
    "Flask~=3.1.3",
    "jsonschema~=4.26.0",
    "mongomock~=4.3.0",
    "pytest~=9.1.0",
    "build~=1.5.0",
    "twine~=6.2.0"
]

[project.urls]
Homepage = "https://github.com/henrydwright/pyehr"
Issues = "https://github.com/henrydwright/pyehr/issues"
